<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cek Kelulusan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <div class="badge">Tugas Pemrograman</div>
      <h1>Cek Kelulusan</h1>
      <p class="subtitle">Masukkan nilai untuk mengetahui apakah kamu lulus.</p>

      <form id="formNilai">
        <label for="nilai">Nilai kamu</label>
        <input
          type="number"
          id="nilai"
          min="0"
          max="100"
          placeholder="Contoh: 80"
          required
        >
        <button type="submit">Cek Nilai</button>
      </form>

      <div id="hasil" class="hasil" aria-live="polite">
        Hasil akan muncul di sini.
      </div>
    </section>

    <section class="card flowchart-card">
      <h2>Flowchart</h2>
      <div class="flowchart">
        <div class="flow start">MULAI</div>
        <div class="arrow">↓</div>
        <div class="flow input">INPUT<br><span>Nilai</span></div>
        <div class="arrow">↓</div>
        <div class="flow process">PROSES<br><span>Membaca nilai</span></div>
        <div class="arrow">↓</div>
        <div class="flow decision">NILAI ≥ 75?</div>
        <div class="branches">
          <div>
            <small>YA</small>
            <div class="arrow">↓</div>
            <div class="flow output">OUTPUT<br><span>LULUS</span></div>
          </div>
          <div>
            <small>TIDAK</small>
            <div class="arrow">↓</div>
            <div class="flow output fail">OUTPUT<br><span>TIDAK LULUS</span></div>
          </div>
        </div>
        <div class="arrow">↓</div>
        <div class="flow end">SELESAI</div>
      </div>
    </section>

    <footer>
      Dibuat dengan HTML, CSS, dan JavaScript
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
